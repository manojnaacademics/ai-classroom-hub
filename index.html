<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Document Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 680px;
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #0f172a;
    }
    p {
      color: #64748b;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }
    button {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: background-color 0.2s ease;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    hr {
      margin: 32px 0 24px 0;
      border: 0;
      border-top: 1px solid #e2e8f0;
    }
    h2 {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: #334155;
    }
    ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    li.doc-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 14px 18px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    li.doc-item a {
      color: #0284c7;
      text-decoration: none;
      font-weight: 500;
      word-break: break-all;
    }
    li.doc-item a:hover {
      text-decoration: underline;
    }
    .date {
      font-size: 0.8rem;
      color: #94a3b8;
      white-space: nowrap;
    }
    .empty-state {
      color: #94a3b8;
      font-size: 0.9rem;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Document Portal</h1>
    <p>Upload files to Cloudinary. All documents are stored permanently and accessible below.</p>

    <!-- Upload Button -->
    <button id="upload-widget">Upload New Document</button>

    <hr />

    <h2>Available Documents</h2>
    <ul id="file-list">
      <li class="empty-state">Loading documents...</li>
    </ul>
  </div>

  <!-- Cloudinary Upload Widget CDN -->
  <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // --- Configured Credentials ---
    const CLOUD_NAME = "njzbnrlk";
    const UPLOAD_PRESET = "my_docs_preset";

    const SUPABASE_URL = "https://egcylvuuyauqilnxtqtu.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVnY3lsdnV1eWF1cWlsbnh0cXR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1Mjc4MDMsImV4cCI6MjEwNjEwMzgwM30.quboraPvIRB_tPpyeTTqOfY6FG7ApJ7R-tkhKdyzdCQ";

    // Initialize Supabase Client
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const listElement = document.getElementById("file-list");

    // Fetch and display documents from Supabase
    async function loadDocuments() {
      const { data, error } = await supabaseClient
        .from("documents")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        console.error("Error loading documents:", error);
        listElement.innerHTML = `<li class="empty-state">Error loading documents: ${error.message}</li>`;
        return;
      }

      if (!data || data.length === 0) {
        listElement.innerHTML = '<li class="empty-state">No documents uploaded yet.</li>';
        return;
      }

      listElement.innerHTML = "";
      data.forEach((doc) => {
        const item = document.createElement("li");
        item.className = "doc-item";

        const formattedDate = new Date(doc.created_at).toLocaleDateString(undefined, {
          year: "numeric",
          month: "short",
          day: "numeric"
        });

        item.innerHTML = `
          <a href="${doc.file_url}" target="_blank" rel="noopener noreferrer">${doc.title}</a>
          <span class="date">${formattedDate}</span>
        `;
        listElement.appendChild(item);
      });
    }

    // Save document record to Supabase
    async function saveDocument(title, fileUrl) {
      const { error } = await supabaseClient
        .from("documents")
        .insert([{ title: title, file_url: fileUrl }]);

      if (error) {
        console.error("Error saving document to Supabase:", error);
        alert("Upload to Cloudinary succeeded, but database save failed: " + error.message);
      } else {
        loadDocuments();
      }
    }

    // Configure Cloudinary Widget
    const myWidget = cloudinary.createUploadWidget(
      {
        cloudName: CLOUD_NAME,
        uploadPreset: UPLOAD_PRESET,
        sources: ["local", "url", "camera"],
        multiple: false
      },
      (error, result) => {
        if (!error && result && result.event === "success") {
          const fileUrl = result.info.secure_url;
          const fileName = result.info.original_filename || "Document";
          saveDocument(fileName, fileUrl);
        }
      }
    );

    // Open upload modal on button click
    document.getElementById("upload-widget").addEventListener("click", () => {
      myWidget.open();
    });

    // Run on initial page load
    loadDocuments();
  </script>
</body>
</html>
